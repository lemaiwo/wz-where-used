_schema-version: 3.3.0
ID: wz-where-used
version: 1.0.0
description: "Where-used analysis for SAP Build Work Zone content (roles, catalogs, groups, spaces, pages)"
parameters:
  enable-parallel-deployments: true
  deploy_mode: html5-repo
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production
modules:
  - name: wz-where-used-srv
    type: nodejs
    path: gen/srv
    parameters:
      instances: 1
      buildpack: nodejs_buildpack
    build-parameters:
      builder: npm-ci
    provides:
      - name: srv-api # required by consumers of CAP services (e.g. approuter)
        properties:
          srv-url: ${default-url}
    requires:
      - name: wz-where-used-auth
      - name: wz-where-used-db
      - name: wz-where-used-destination

  - name: wz-where-used-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
    requires:
      - name: wz-where-used-db

  - name: wz-where-used-app-deployer
    type: com.sap.application.content
    path: gen
    build-parameters:
      build-result: app/
      requires:
        - name: wzwhereusedwhereused
          artifacts:
            - whereused.zip
          target-path: app/
    requires:
      - name: wz-where-used-auth
      - name: srv-api
      - name: wz-where-used-html5-repo-host
        parameters:
          content-target: true
          config:
            HTML5Runtime_enabled: true
    parameters:
      config:
        destinations:
          - Name: srv-api
            URL: ~{srv-api/srv-url}
            Authentication: NoAuthentication
            Type: HTTP
            ProxyType: Internet
            ForwardAuthToken: true
            DynamicDestination: true

  - name: wzwhereusedwhereused
    type: html5
    path: app/whereused
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm ci
        - npm run build
      supported-platforms:
        []

  - name: wz-where-used-destinations
    type: com.sap.application.content
    requires:
      - name: wz-where-used-auth
        parameters:
          service-key:
            name: wz-where-used-auth-key
      - name: wz-where-used-html5-repo-host
        parameters:
          service-key:
            name: wz-where-used-html5-repo-host-key
      - name: srv-api
      - name: wz-where-used-destination
        parameters:
          content-target: true
    build-parameters:
      no-source: true
    parameters:
      content:
        instance:
          existing_destinations_policy: update
          destinations:
            - Name: wz-where-used-html5-repository
              ServiceInstanceName: wz-where-used-html5-repo-host
              ServiceKeyName: wz-where-used-html5-repo-host-key
              sap.cloud.service: wzwhereused.service
            - Name: wz-where-used-auth
              Authentication: OAuth2UserTokenExchange
              ServiceInstanceName: wz-where-used-auth
              ServiceKeyName: wz-where-used-auth-key
              sap.cloud.service: wzwhereused.service

resources:
  - name: wz-where-used-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: wz-where-used-${org}-${space}
        tenant-mode: dedicated
        oauth2-configuration:
          credential-types:
            - "binding-secret"
            - "x509"
        role-collections:
          - name: 'WhereUsedViewer (wz-where-used ${org}-${space})'
            description: 'Work Zone Where-Used'
            role-template-references:
              - '$XSAPPNAME.WhereUsedViewer'
          - name: 'WhereUsedAdmin (wz-where-used ${org}-${space})'
            description: 'Work Zone Where-Used'
            role-template-references:
              - '$XSAPPNAME.WhereUsedViewer'
              - '$XSAPPNAME.WhereUsedAdmin'
  - name: wz-where-used-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
  - name: wz-where-used-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite
      config:
        HTML5Runtime_enabled: true
    requires:
      - name: srv-api

  - name: wz-where-used-html5-repo-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host
